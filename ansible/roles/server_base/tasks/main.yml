---
- name: Base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - fail2ban
      - gnupg
      - restic
      - rsync
      - ufw
      - unattended-upgrades
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Timezone
  community.general.timezone:
    name: "{{ server_base_timezone }}"

- name: Unattended security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

# `sshd -t` refuses to run without its privilege separation directory, and on a socket-activated
# Ubuntu (26.04) /run/sshd only exists while a connection is being served — so the check fails on a
# server configured from the machine itself (deploy/install-server.py, connection: local).
- name: The directory sshd -t insists on
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "0755"

- name: SSH hardening
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-norboten.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      AllowUsers {{ server_base_admin_user }}
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Firewall defaults
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - {direction: incoming, policy: deny}
    - {direction: outgoing, policy: allow}

- name: Firewall openings
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ server_base_allowed_tcp }}"

- name: Firewall openings (udp)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: udp
  loop: "{{ server_base_allowed_udp }}"

- name: Enable the firewall
  community.general.ufw:
    state: enabled

- name: Docker engine
  ansible.builtin.include_tasks: docker.yml
