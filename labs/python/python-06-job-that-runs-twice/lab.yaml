  - {id: 02_a_second_run_is_refused, objective: 1, weight: 2}
  - {id: 03_the_output_is_never_half_written, objective: 2, weight: 2}
  - {id: 04_the_timer_runs_it_often, objective: 3, baseline_pass: true}
