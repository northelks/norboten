schema_version: 1
topic: python-01-sync-that-says-it-worked
topics: [python, boot-systemd]
title: "Theory: jobs that tell the truth"
description: Exit status from Python, network timeouts and atomic file replacement.
questions:
  - id: py1-001
    type: single
    difficulty: 2
    prompt: What does this print?
    code: |
      import subprocess, sys
      code = "def main():\n    return 3\nmain()"
      print(subprocess.run([sys.executable, "-c", code]).returncode,
            subprocess.run([sys.executable, "-c", "import sys\nsys.exit(3)"]).returncode)
    code_lang: python
    choices:
      - {id: a, text: "1 3"}
      - {id: b, text: "3 0"}
      - {id: c, text: "0 3"}
      - {id: d, text: "3 3"}
    answer: [c]
    explanation: >-
      A return value from main() is just a value; a Python process that reaches the end of its
      script exits 0 unless sys.exit (or an uncaught exception, status 1) says otherwise. That is
      why jobs end with sys.exit(main()).
    references: ["https://docs.python.org/3/library/sys.html#sys.exit"]
    tags: [exit-status]
    verify:
      runtime: python
      code: |
        import subprocess, sys
        code = "def main():\n    return 3\nmain()"
        print(subprocess.run([sys.executable, "-c", code]).returncode,
              subprocess.run([sys.executable, "-c", "import sys\nsys.exit(3)"]).returncode)
  - id: py1-002
    type: single
    difficulty: 2
    prompt: What does this print?
    code: |
      import json, socket, urllib.error
      print(issubclass(urllib.error.HTTPError, OSError),
            issubclass(TimeoutError, OSError),
            issubclass(json.JSONDecodeError, ValueError))
    code_lang: python
    choices:
      - {id: a, text: "True False True"}
      - {id: b, text: "False False False"}
      - {id: c, text: "True True True"}
      - {id: d, text: "False True True"}
    answer: [c]
    explanation: >-
      HTTPError derives from URLError, which derives from OSError, and TimeoutError is an OSError
      too; JSONDecodeError derives from ValueError. So catching (OSError, ValueError) around a fetch
      covers network failures, HTTP errors, timeouts and bad JSON without hiding programming errors.
    references: ["https://docs.python.org/3/library/exceptions.html#exception-hierarchy", "https://docs.python.org/3/library/urllib.error.html"]
    tags: [exceptions]
    verify:
      runtime: python
      code: |
        import json, socket, urllib.error
        print(issubclass(urllib.error.HTTPError, OSError),
              issubclass(TimeoutError, OSError),
              issubclass(json.JSONDecodeError, ValueError))
  - id: py1-003
    type: single
    difficulty: 3
    prompt: What does this print?
    code: |
      import os, tempfile
      d = tempfile.mkdtemp()
      path = os.path.join(d, "data.json")
      open(path, "w").write("old")
      before = os.stat(path).st_ino
      fd, tmp = tempfile.mkstemp(dir=d)
      os.write(fd, b"new"); os.close(fd)
      os.replace(tmp, path)
      print(os.stat(path).st_ino == before, oct(os.stat(path).st_mode & 0o777))
    code_lang: python
    choices:
      - {id: a, text: "True 0o644"}
      - {id: b, text: "True 0o600"}
      - {id: c, text: "False 0o644"}
      - {id: d, text: "False 0o600"}
    answer: [d]
    explanation: >-
      os.replace renames the temporary file over the path, so the path now names a different inode.
      mkstemp creates files with mode 0600, and the rename keeps that mode — a file other services
      must read needs a chmod before the rename.
    references: ["https://docs.python.org/3/library/tempfile.html#tempfile.mkstemp", "https://docs.python.org/3/library/os.html#os.replace"]
    tags: [files, atomicity]
    verify:
      runtime: python
      code: |
        import os, tempfile
        d = tempfile.mkdtemp()
        path = os.path.join(d, "data.json")
        open(path, "w").write("old")
        before = os.stat(path).st_ino
        fd, tmp = tempfile.mkstemp(dir=d)
        os.write(fd, b"new"); os.close(fd)
        os.replace(tmp, path)
        print(os.stat(path).st_ino == before, oct(os.stat(path).st_mode & 0o777))
  - id: py1-004
    type: single
    difficulty: 2
    prompt: A oneshot service run by a timer hangs forever on a network call. What happens to the timer's next activations?
    choices:
      - {id: a, text: "systemd starts a second copy of the service in parallel"}
      - {id: b, text: "The timer disables itself"}
      - {id: c, text: "They do not start a new run while the service is still activating"}
      - {id: d, text: "systemd kills the hung run after five minutes by default"}
    answer: [c]
    explanation: >-
      A timer activates its unit; a unit that is already activating is not started again, so one
      hung run blocks every later one. Oneshot services have no start timeout by default
      (TimeoutStartSec=infinity for Type=oneshot), which is why the job itself must time out.
    references: ["man 5 systemd.timer", "man 5 systemd.service (TimeoutStartSec)"]
    tags: [systemd, timeouts]
