checks:
  01_the_review_runs_in_the_reviewer:
    level_1: "The model asks for the reviewer by name, and Claude Code does not know it."
    level_2: "Read what Claude Code answered the model's request for the agent: it lists the
              agents it does know. Then compare where and how yours is defined with the
              documentation for subagents."
    level_3: "Run the job and read the tool result in the session transcript under
              ~/.claude/projects. Project subagents are Markdown files in one specific
              directory, and two frontmatter keys are required."
    level_4: "The file is in .claude/agent/ instead of .claude/agents/, and its frontmatter says
              desc: where Claude Code requires description:. Either fault alone hides the agent."
    refs:
      2: ["https://code.claude.com/docs/en/sub-agents"]
      3: ["journal:claude-03-the-reviewer-nobody-calls#where-subagents-come-from", "journal:claude-03-the-reviewer-nobody-calls#evidence-that-a-subagent-ran"]
  02_the_reviewer_can_only_read:
    level_1: "Once found, the reviewer can do far more than read."
    level_2: "A subagent that does not say which tools it has gets them all, from the session
              that starts it."
    level_3: "The frontmatter key tools takes a comma-separated list of tool names, spelled as
              Claude Code spells them."
    level_4: "The reviewer has no tools line, so it inherits Bash, Edit, Write and the rest.
              Give it Read, Grep and Glob."
    refs:
      2: ["journal:claude-code#what-the-model-may-do"]
      3: ["journal:claude-03-the-reviewer-nobody-calls#the-frontmatter", "journal:claude-03-the-reviewer-nobody-calls#what-the-subagents-tools-and-model-cost"]
  03_the_reviewer_runs_on_haiku:
    level_1: "The reviewer runs on a bigger model than the team pays for."
    level_2: "A subagent can name its own model, independent of the session's."
    level_3: "The frontmatter key model takes an alias (haiku, sonnet, opus), a full model id,
              or inherit."
    level_4: "The reviewer says model: opus. It should say haiku."
    refs:
      2: ["journal:claude-code#what-a-run-costs"]
      3: ["journal:claude-03-the-reviewer-nobody-calls#the-frontmatter"]
