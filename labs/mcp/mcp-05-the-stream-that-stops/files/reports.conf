# The reports MCP server, published on :8080. Every client goes through here: this is where access
# is logged, and where TLS will be terminated.
server {
    listen 127.0.0.1:8080;
    access_log /var/log/nginx/reports.access.log;

    location /mcp {
        proxy_pass http://127.0.0.1:8931;
        proxy_set_header Host $host;
        proxy_read_timeout 2s;
        proxy_buffering on;
    }
}
