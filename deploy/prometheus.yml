global:
  scrape_interval: 30s
  external_labels:
    project: norboten

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: postgres
    static_configs: [{targets: ["postgres-exporter:9187"]}]
  - job_name: api
    metrics_path: /metrics
    static_configs: [{targets: ["api:8000"]}]
