  - id: ol-034
    type: single
    difficulty: 2
    prompt: What are Ollama's durations such as load_duration and eval_duration measured in?
    choices:
      - {id: a, text: "Tokens"}
      - {id: b, text: "Seconds, as floats"}
      - {id: c, text: "Milliseconds"}
      - {id: d, text: "Nanoseconds"}
    answer: [d]
    explanation: >-
      The API returns all durations in nanoseconds: a load_duration of 603007669 is 0.6 s. eval_count divided by
      eval_duration (in seconds) gives tokens per second.
    references: ["https://github.com/ollama/ollama/blob/main/docs/api.md"]
    tags: [api, performance]
