  - id: ol-036
    type: single
    difficulty: 2
    prompt: >-
      A long generation through nginx fails after exactly 60 seconds with 504, but streams fine with
      "stream": true. Which nginx directive is involved?
    choices:
      - {id: a, text: "keepalive_timeout"}
      - {id: b, text: "proxy_read_timeout: with streaming off, nothing arrives until the answer is complete"}
      - {id: c, text: "send_timeout on the client side"}
      - {id: d, text: "client_body_timeout"}
    answer: [b]
    explanation: >-
      proxy_read_timeout (60 s by default) is the gap allowed between two reads from the backend. A streamed answer
      sends a token at a time; a non-streamed one sends nothing until generation ends.
    references: ["https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_read_timeout"]
    tags: [proxy]
  # -- local models in practice -------------------------------------------------------------------
  - id: ol-037
    type: single
    difficulty: 2
    topics: [ai-services]
    prompt: Which job is a small local model like qwen2.5:0.5b well suited to?
    choices:
      - {id: a, text: "Answering factual questions without retrieval"}
      - {id: b, text: "Reliably following thirty rules in a long system prompt"}
      - {id: c, text: "Writing and reviewing large code changes"}
      - {id: d, text: "Short, constrained tasks — classifying, extracting fields, rephrasing — where data must stay on the machine"}
    answer: [d]
    explanation: >-
      A half-billion-parameter model is fast and cheap on a CPU and keeps data local, but follows complex
      instructions poorly and knows little. Norboten's consultant uses one to answer from retrieved passages, not
      from its own knowledge.
    references: ["https://github.com/ollama/ollama/blob/main/docs/faq.mdx"]
    tags: [models, practice]
  - id: ol-038
    type: single
    difficulty: 2
    prompt: Does running a model with Ollama locally send prompts to ollama.com?
    choices:
      - {id: a, text: "Yes, unless OLLAMA_HOST is set"}
      - {id: b, text: "No: local models run on the machine; only cloud models, if used, send prompts to Ollama's service"}
      - {id: c, text: "Yes, for telemetry"}
      - {id: d, text: "Only the first prompt of each session"}
    answer: [b]
    explanation: >-
      The FAQ states that local runs are not seen by Ollama; cloud-hosted models are processed by its service.
      Cloud features can be turned off with OLLAMA_NO_CLOUD=1. Pulling a model does contact the registry.
    references: ["https://github.com/ollama/ollama/blob/main/docs/faq.mdx"]
    tags: [privacy]
  - id: ol-039
    type: single
    difficulty: 3
    prompt: A machine must run Ollama with no internet access. What has to happen before it is disconnected?
    choices:
      - {id: a, text: "Export each model with ollama export"}
      - {id: b, text: "Pull every model it needs into OLLAMA_MODELS (or copy that directory from a machine that has them)"}
      - {id: c, text: "Nothing: models are downloaded on first use from a local cache in the binary"}
      - {id: d, text: "Set OLLAMA_OFFLINE=1"}
    answer: [b]
    explanation: >-
      Models are blobs and manifests under the models directory; with them present the server needs no network.
      Norboten's automation image pulls qwen2.5:0.5b and all-minilm at build time for exactly this reason (424 MB).
    references: ["https://github.com/ollama/ollama/blob/main/docs/faq.mdx"]
    tags: [storage, practice]
  - id: ol-040
    type: single
    difficulty: 2
    prompt: Which command answers "is the model loaded, and until when?" from a shell?
    choices:
      - {id: a, text: "systemctl status ollama"}
      - {id: b, text: "ollama list"}
      - {id: c, text: "ollama show qwen2.5:0.5b"}
      - {id: d, text: "ollama ps"}
    answer: [d]
    explanation: >-
      ollama ps shows loaded models, their memory and the UNTIL column from keep-alive. list is what is on disk;
      systemctl status is the server process; show is a model's definition.
    references: ["https://github.com/ollama/ollama/blob/main/docs/faq.mdx"]
    tags: [cli, keep-alive]
