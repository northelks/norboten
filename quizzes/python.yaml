schema_version: 1
topic: python
topics: [python]
title: Python for automation
description: The Python that automation scripts are made of — and the surprises in it.
questions:
  - id: py-001
    type: single
    difficulty: 1
    prompt: What does this print?
    code: print([1, 2, 3][-1])
    code_lang: python
    choices:
      - {id: a, text: "1"}
      - {id: b, text: "[3]"}
      - {id: c, text: "3"}
      - {id: d, text: "IndexError"}
    answer: [c]
    explanation: Negative indices count from the end, so -1 is the last element. Slicing ([-1:]) would give a list.
    references: ["https://docs.python.org/3/tutorial/introduction.html#lists"]
    tags: [lists]
    verify:
      runtime: python
      code: print([1, 2, 3][-1])
  - id: py-002
    type: single
    difficulty: 2
    prompt: What does this print?
    code: |
      d = {}
      d.setdefault("k", []).append(1)
      print(d)
    code_lang: python
    choices:
      - {id: a, text: "{'k': [1]}"}
      - {id: b, text: "{}"}
      - {id: c, text: "KeyError: 'k'"}
      - {id: d, text: "{'k': []}"}
    answer: [a]
    explanation: >-
      setdefault inserts the default when the key is missing and returns the stored value, so
      append modifies the list inside the dict.
    references: ["https://docs.python.org/3/library/stdtypes.html#dict.setdefault"]
    tags: [dicts]
    verify:
      runtime: python
      code: |
        d = {}
        d.setdefault("k", []).append(1)
        print(d)
  - id: py-003
    type: single
    difficulty: 3
    prompt: What does this print?
    code: |
      def add(x, acc=[]):
          acc.append(x)
          return acc

      add(1)
      print(add(2))
    code_lang: python
    choices:
      - {id: a, text: "None"}
      - {id: b, text: "[2]"}
      - {id: c, text: "[1, 2]"}
      - {id: d, text: "[1]"}
    answer: [c]
    explanation: >-
      Default values are evaluated once, when the function is defined, so every call without acc
      shares the same list. Use acc=None and create the list inside the function.
    references: ["https://docs.python.org/3/tutorial/controlflow.html#default-argument-values"]
    tags: [functions, pitfalls]
    verify:
      runtime: python
      code: |
        def add(x, acc=[]):
            acc.append(x)
            return acc
        add(1)
        print(add(2))
  - id: py-004
    type: single
    difficulty: 1
    prompt: What does the `if __name__ == "__main__":` block do?
    choices:
      - {id: a, text: "Runs its code only when the file is executed directly, not when it is imported"}
      - {id: b, text: "Marks the function Python should call first"}
      - {id: c, text: "Runs its code before anything else in the file"}
      - {id: d, text: "Makes the file importable"}
    answer: [a]
    explanation: >-
      A module's __name__ is "__main__" only when it is the program being run. Importing sets it
      to the module name, so the block is skipped — handy for scripts that are also libraries.
    references: ["https://docs.python.org/3/library/__main__.html"]
    tags: [modules]
  - id: py-005
    type: single
    difficulty: 1
    prompt: Which is the standard-library way to run a command and capture its output and exit status?
    choices:
      - {id: a, text: "sys.exec(...)"}
      - {id: b, text: "subprocess.run(..., capture_output=True, text=True)"}
      - {id: c, text: "os.system(...)"}
      - {id: d, text: "shutil.run(...)"}
    answer: [b]
    explanation: >-
      subprocess.run returns a CompletedProcess with returncode, stdout and stderr. os.system only
      returns the status and runs through a shell; shutil.run and sys.exec do not exist.
    references: ["https://docs.python.org/3/library/subprocess.html#subprocess.run"]
    tags: [subprocess]
  - id: py-006
    type: single
    difficulty: 2
    prompt: What does this print?
    code: print(sorted(["b", "A", "a"]))
    code_lang: python
    choices:
      - {id: a, text: "['A', 'b', 'a']"}
      - {id: b, text: "['A', 'a', 'b']"}
      - {id: c, text: "['a', 'A', 'b']"}
      - {id: d, text: "['a', 'b', 'A']"}
    answer: [b]
    explanation: >-
      Strings compare by code point, and uppercase letters come before lowercase in ASCII. For a
      case-insensitive order use key=str.lower (or str.casefold).
    references: ["https://docs.python.org/3/howto/sorting.html"]
    tags: [sorting]
    verify:
      runtime: python
      code: print(sorted(["b", "A", "a"]))
  - id: py-007
    type: single
    difficulty: 1
    prompt: What does `python3 -m venv .venv` create?
    choices:
      - {id: a, text: "A lock file of the installed packages"}
      - {id: b, text: "A copy of the whole Python installation, standard library included"}
      - {id: c, text: "An isolated environment with its own interpreter entry point and site-packages"}
      - {id: d, text: "A container image with Python inside"}
    answer: [c]
    explanation: >-
      A venv links to the base interpreter and has its own site-packages, so pip installs stay
      out of the system Python. Scripts that need it must use .venv/bin/python — not
      /usr/bin/python3.
    references: ["https://docs.python.org/3/library/venv.html"]
    tags: [packaging]
  - id: py-008
    type: single
    difficulty: 1
    prompt: What does this print?
    code: print(" a  b ".split())
    code_lang: python
    choices:
      - {id: a, text: "['', 'a', '', 'b', '']"}
      - {id: b, text: "['a', '', 'b']"}
      - {id: c, text: "['a', 'b']"}
      - {id: d, text: "[' a  b ']"}
    answer: [c]
    explanation: >-
      With no separator, split() splits on runs of whitespace and drops leading and trailing
      whitespace. split(" ") would keep the empty strings.
    references: ["https://docs.python.org/3/library/stdtypes.html#str.split"]
    tags: [strings]
    verify:
      runtime: python
      code: print(" a  b ".split())
  - id: py-009
    type: single
    difficulty: 2
    prompt: What does this print?
    code: print(0.1 + 0.2 == 0.3)
    code_lang: python
    choices:
      - {id: a, text: "False"}
      - {id: b, text: "0.3"}
      - {id: c, text: "True"}
      - {id: d, text: "None"}
    answer: [a]
    explanation: >-
      Binary floating point cannot represent 0.1 exactly; the sum is 0.30000000000000004. Compare
      with math.isclose, or use decimal.Decimal for money.
    references: ["https://docs.python.org/3/tutorial/floatingpoint.html"]
    tags: [numbers]
    verify:
      runtime: python
      code: print(0.1 + 0.2 == 0.3)
  - id: py-010
    type: multiple
    difficulty: 2
    prompt: Which HTTP methods are idempotent by definition, so a client may safely retry them?
    choices:
      - {id: a, text: PUT}
      - {id: b, text: GET}
      - {id: c, text: DELETE}
      - {id: d, text: PATCH}
      - {id: e, text: POST}
    answer: [a, b, c]
    explanation: >-
      RFC 9110 defines GET, HEAD, OPTIONS, TRACE, PUT and DELETE as idempotent: repeating the
      request has the same effect as sending it once. POST and PATCH are not, so retrying them
      needs an idempotency key or a server-side check.
    references: ["https://www.rfc-editor.org/rfc/rfc9110#section-9.2.2"]
    tags: [http, retries]
  - id: py-011
    type: single
    difficulty: 1
    prompt: What does `with open(path) as f:` guarantee?
    choices:
      - {id: a, text: "The file is created if it does not exist"}
      - {id: b, text: "The file is read completely into memory"}
      - {id: c, text: "The file is locked against other processes"}
      - {id: d, text: "The file is closed when the block exits, even if an exception is raised"}
    answer: [d]
    explanation: >-
      The file object is a context manager: __exit__ closes it however the block ends. It does not
      lock the file, read it, or create it (that depends on the mode).
    references: ["https://docs.python.org/3/reference/compound_stmts.html#with"]
    tags: [files]
  - id: py-012
    type: single
    difficulty: 2
    prompt: What does this print?
    code: |
      import json
