    tags: [json]
    verify:
      runtime: python
      code: |
        import json
        print(type(json.loads('{"a": 1}')).__name__)
  - id: py-013
    type: single
    difficulty: 2
    prompt: What does this print?
    code: |
      a = [1, 2, 3]
      b = a
      b += [4]
      print(len(a))
    code_lang: python
    choices:
      - {id: a, text: "4"}
      - {id: b, text: "3"}
      - {id: c, text: "TypeError"}
      - {id: d, text: "7"}
    answer: [a]
    explanation: >-
      b = a copies the reference, not the list, and += on a list extends it in place. Both names
      point at the same four-element list. b = b + [4] would have built a new list and left a
      alone; a.copy() or list(a) makes a real copy.
    references: ["https://docs.python.org/3/faq/programming.html#why-did-changing-list-y-also-change-list-x"]
    tags: [lists, pitfalls]
    verify:
      runtime: python
      code: |
        a = [1, 2, 3]
        b = a
        b += [4]
        print(len(a))
  - id: py-014
    type: single
    difficulty: 3
    prompt: What does this print?
    code: |
      grid = [[0] * 2] * 2
      grid[0][0] = 1
      print(grid)
    code_lang: python
    choices:
      - {id: a, text: "[[1, 0], [0, 0]]"}
      - {id: b, text: "[[1, 0], [1, 0]]"}
      - {id: c, text: "[[1, 0]]"}
      - {id: d, text: "[[1, 1], [0, 0]]"}
    answer: [b]
    explanation: >-
      Multiplying the outer list repeats a reference to the same inner list, so both rows are one
      object and the change shows twice. [[0] * 2 for _ in range(2)] builds independent rows.
    references: ["https://docs.python.org/3/faq/programming.html#how-do-i-create-a-multidimensional-list"]
    tags: [lists, pitfalls]
    verify:
      runtime: python
      code: |
        grid = [[0] * 2] * 2
        grid[0][0] = 1
        print(grid)
  - id: py-015
    type: single
    difficulty: 3
    prompt: What does this print?
    code: |
      fs = [lambda: i for i in range(3)]
      print([f() for f in fs])
    code_lang: python
    choices:
      - {id: a, text: "NameError"}
      - {id: b, text: "[0, 0, 0]"}
      - {id: c, text: "[2, 2, 2]"}
      - {id: d, text: "[0, 1, 2]"}
    answer: [c]
    explanation: >-
      A closure looks up i when it is called, not when it is created, and by then the loop has
      finished with i = 2. Binding the value at creation — lambda i=i: i — gives [0, 1, 2].
    references: ["https://docs.python.org/3/faq/programming.html#why-do-lambdas-defined-in-a-loop-with-different-values-all-return-the-same-result"]
    tags: [functions, pitfalls]
    verify:
      runtime: python
      code: |
        fs = [lambda: i for i in range(3)]
        print([f() for f in fs])
  - id: py-016
    type: single
    difficulty: 1
    prompt: What does this print?
    code: print("a,b,,c".split(","))
    code_lang: python
    choices:
      - {id: a, text: "['a', 'b', 'c']"}
      - {id: b, text: "['a,b,,c']"}
      - {id: c, text: "['a', 'b', '', 'c']"}
      - {id: d, text: "['a', 'b', ',', 'c']"}
    answer: [c]
    explanation: >-
      With an explicit separator, split keeps empty fields between adjacent separators. Only
      split() with no argument splits on runs of whitespace and drops empty strings.
    references: ["https://docs.python.org/3/library/stdtypes.html#str.split"]
    tags: [strings]
    verify:
      runtime: python
      code: print("a,b,,c".split(","))
  - id: py-017
    type: single
    difficulty: 2
    prompt: What does this print?
    code: print("  host:8080\n".strip().rsplit(":", 1))
    code_lang: python
    choices:
      - {id: a, text: "['  host', '8080\\n']"}
      - {id: b, text: "['host:8080']"}
      - {id: c, text: "('host', '8080')"}
      - {id: d, text: "['host', '8080']"}
    answer: [d]
    explanation: >-
      strip() removes surrounding whitespace, newline included, and rsplit(":", 1) splits once
      from the right — which keeps an IPv6-ish or colon-containing host part intact on the left.
      split returns a list, not a tuple.
    references: ["https://docs.python.org/3/library/stdtypes.html#str.rsplit"]
    tags: [strings]
    verify:
      runtime: python
      code: print("  host:8080\n".strip().rsplit(":", 1))
  - id: py-018
    type: single
    difficulty: 2
    prompt: What does this print?
    code: print(round(2.5), round(3.5))
    code_lang: python
    choices:
      - {id: a, text: "3 3"}
      - {id: b, text: "2 4"}
      - {id: c, text: "2 3"}
      - {id: d, text: "3 4"}
    answer: [b]
    explanation: >-
      Python 3 rounds halves to the nearest even integer (banker's rounding), so 2.5 goes down and
      3.5 goes up. It avoids a systematic upward bias when summing many rounded values.
    references: ["https://docs.python.org/3/library/functions.html#round"]
    tags: [numbers]
    verify:
      runtime: python
      code: print(round(2.5), round(3.5))
  - id: py-019
    type: single
    difficulty: 1
    prompt: What does this print?
    code: print(7 // 2, -7 // 2, 7 % -2)
    code_lang: python
    choices:
      - {id: a, text: "3 -3 -1"}
      - {id: b, text: "3 -4 -1"}
      - {id: c, text: "3.5 -3.5 1"}
      - {id: d, text: "3 -3 1"}
    answer: [b]
    explanation: >-
      // floors towards negative infinity, so -7 // 2 is -4, not -3; and % takes the sign of the
      divisor so that (a // b) * b + a % b == a always holds.
    references: ["https://docs.python.org/3/reference/expressions.html#binary-arithmetic-operations"]
    tags: [numbers]
    verify:
      runtime: python
      code: print(7 // 2, -7 // 2, 7 % -2)
  - id: py-020
    type: single
    difficulty: 2
    prompt: What does this print?
    code: |
      d = {"b": 1, "a": 2}
      d["c"] = 3
      print(list(d))
    code_lang: python
    choices:
      - {id: a, text: "[1, 2, 3]"}
      - {id: b, text: "an order that changes from run to run"}
      - {id: c, text: "['b', 'a', 'c']"}
      - {id: d, text: "['a', 'b', 'c']"}
    answer: [c]
    explanation: >-
      Since Python 3.7, dicts keep insertion order as part of the language, and iterating a dict
      yields its keys. Sorting needs sorted(d).
    references: ["https://docs.python.org/3/library/stdtypes.html#dict"]
    tags: [dicts]
    verify:
      runtime: python
      code: |
        d = {"b": 1, "a": 2}
        d["c"] = 3
        print(list(d))
  - id: py-021
    type: single
    difficulty: 2
    prompt: What does this print?
    code: |
      from collections import Counter
      c = Counter("mississippi")
      print(c.most_common(2))
    code_lang: python
    choices:
      - {id: a, text: "[('s', 4), ('i', 4)]"}
      - {id: b, text: "[('i', 4), ('p', 2)]"}
      - {id: c, text: "{'i': 4, 's': 4}"}
      - {id: d, text: "[('i', 4), ('s', 4)]"}
    answer: [d]
    explanation: >-
      i and s both occur four times; elements with equal counts keep the order in which they were
      first seen, and i comes before s in the string. most_common returns a list of
      (element, count) pairs.
    references: ["https://docs.python.org/3/library/collections.html#collections.Counter.most_common"]
    tags: [collections]
    verify:
      runtime: python
      code: |
        from collections import Counter
        c = Counter("mississippi")
        print(c.most_common(2))
  - id: py-022
    type: single
    difficulty: 2
    prompt: What does this print?
    code: |
      from collections import defaultdict
      hosts = defaultdict(list)
      hosts["web"].append("w1")
      print(dict(hosts), hosts["db"])
    code_lang: python
    choices:
      - {id: a, text: "{'web': ['w1']} []"}
      - {id: b, text: "{'web': ['w1']} None"}
      - {id: c, text: "{'web': 'w1'} []"}
      - {id: d, text: "KeyError: 'db'"}
    answer: [a]
    explanation: >-
      A defaultdict calls its factory for a missing key, stores the result and returns it, so
      hosts["db"] is a new empty list — and, as a side effect, "db" is now a key. dict(hosts) was
      taken before that lookup, so it has only web.
    references: ["https://docs.python.org/3/library/collections.html#collections.defaultdict"]
    tags: [collections, dicts]
    verify:
      runtime: python
      code: |
        from collections import defaultdict
        hosts = defaultdict(list)
        hosts["web"].append("w1")
        print(dict(hosts), hosts["db"])
  - id: py-023
    type: single
    difficulty: 2
    prompt: What does this print?
    code: |
      gen = (x * x for x in range(3))
      print(sum(gen), sum(gen))
    code_lang: python
    choices:
      - {id: a, text: "0 0"}
      - {id: b, text: "5 0"}
      - {id: c, text: "5 5"}
      - {id: d, text: "TypeError"}
    answer: [b]
    explanation: >-
      A generator can be consumed once. The first sum reads 0, 1 and 4; the second finds it
      exhausted and sums nothing. Use a list when the values are needed twice.
    references: ["https://docs.python.org/3/glossary.html#term-generator-iterator"]
    tags: [iterators]
    verify:
      runtime: python
      code: |
        gen = (x * x for x in range(3))
        print(sum(gen), sum(gen))
  - id: py-024
    type: single
    difficulty: 2
    prompt: What does this print?
    code: |
      names = ["web1", "web2", "db1"]
      ports = [80, 8080]
      print(list(zip(names, ports)))
    code_lang: python
    choices:
      - {id: a, text: "[['web1', 80], ['web2', 8080]]"}
      - {id: b, text: "ValueError"}
      - {id: c, text: "[('web1', 80), ('web2', 8080)]"}
      - {id: d, text: "[('web1', 80), ('web2', 8080), ('db1', None)]"}
    answer: [c]
    explanation: >-
      zip stops at the shortest input and silently drops the rest. itertools.zip_longest fills the
      gaps, and zip(..., strict=True) (Python 3.10+) raises ValueError when lengths differ.
    references: ["https://docs.python.org/3/library/functions.html#zip"]
    tags: [iterators]
    verify:
      runtime: python
      code: |
        names = ["web1", "web2", "db1"]
        ports = [80, 8080]
        print(list(zip(names, ports)))
  - id: py-025
    type: single
    difficulty: 3
    prompt: What does this print?
    code: |
      def f():
          try:
              return "try"
          finally:
              print("finally", end=" ")
      print(f())
    code_lang: python
    choices:
      - {id: a, text: "finally try"}
      - {id: b, text: "try finally"}
      - {id: c, text: "try"}
      - {id: d, text: "finally"}
    answer: [a]
    explanation: >-
      The finally block runs on the way out of the function, after the return value is computed
      but before the caller receives it, so its print comes first. A return inside finally would
      even replace the original return value.
    references: ["https://docs.python.org/3/reference/compound_stmts.html#the-try-statement"]
    tags: [exceptions]
    verify:
      runtime: python
      code: |
        def f():
            try:
                return "try"
            finally:
                print("finally", end=" ")
        print(f())
  - id: py-026
    type: single
    difficulty: 2
    prompt: What does this print?
    code: |
      try:
          int("8080 ")
          print("int")
      except ValueError:
          print("ValueError")
    code_lang: python
    choices:
      - {id: a, text: "8080"}
      - {id: b, text: "int"}
      - {id: c, text: "TypeError"}
      - {id: d, text: "ValueError"}
    answer: [b]
    explanation: >-
      int() ignores leading and trailing whitespace, so "8080 " converts. It raises ValueError for
      anything else that is not a whole number, such as "80.5" or "80a".
    references: ["https://docs.python.org/3/library/functions.html#int"]
    tags: [numbers, strings]
    verify:
      runtime: python
      code: |
        try:
            int("8080 ")
            print("int")
        except ValueError:
            print("ValueError")
  - id: py-027
    type: single
    difficulty: 2
    prompt: What does this print?
    code: |
      from pathlib import Path
      p = Path("/etc/nginx/conf.d/site.conf")
      print(p.parent.name, p.stem, p.suffix)
    code_lang: python
    choices:
      - {id: a, text: "conf.d site .conf"}
      - {id: b, text: "/etc/nginx/conf.d site.conf .conf"}
      - {id: c, text: "nginx site .conf"}
      - {id: d, text: "conf.d site conf"}
    answer: [a]
    explanation: >-
      parent is the containing directory and .name its last component; stem is the file name
      without its final suffix; suffix includes the dot.
    references: ["https://docs.python.org/3/library/pathlib.html#methods-and-properties"]
    tags: [files]
    verify:
      runtime: python
      code: |
        from pathlib import Path
        p = Path("/etc/nginx/conf.d/site.conf")
        print(p.parent.name, p.stem, p.suffix)
  - id: py-028
    type: single
    difficulty: 3
    prompt: What does this print?
    code: |
      from pathlib import Path
      print(Path("/srv/app") / "/etc/passwd")
    code_lang: python
    choices:
      - {id: a, text: "ValueError"}
      - {id: b, text: "/srv/app/etc/passwd"}
      - {id: c, text: "/etc/passwd"}
      - {id: d, text: "/srv/app//etc/passwd"}
    answer: [c]
    explanation: >-
      Joining an absolute path discards everything before it, as os.path.join does. It is how a
      user-supplied "file name" escapes the intended directory; resolve the result and check it
      is still inside the base (is_relative_to) before using it.
    references: ["https://docs.python.org/3/library/pathlib.html#operators"]
    tags: [files, security]
    verify:
      runtime: python
      code: |
        from pathlib import Path
        print(Path("/srv/app") / "/etc/passwd")
  - id: py-029
    type: single
    difficulty: 2
    prompt: What does this print?
    code: |
      import subprocess
