  - id: py-041
    type: multiple
    difficulty: 2
    prompt: A script calls an HTTP API with urllib or requests. Which of these keep it from hanging forever or retrying blindly?
    choices:
      - {id: a, text: "Retry only on errors that can succeed later, such as 429, 503 or a connection reset, with backoff"}
      - {id: b, text: "Pass a timeout on every request"}
      - {id: c, text: "Rely on the library's default timeout"}
      - {id: d, text: "Wrap the call in while True until it succeeds"}
    answer: [a, b]
    explanation: >-
      Neither urllib.request.urlopen nor requests has a timeout by default, so a server that
      accepts a connection and never answers blocks the script indefinitely. Retrying a 400 or
      401 cannot help, and an unbounded loop turns an outage into a flood of requests.
    references: ["https://docs.python.org/3/library/urllib.request.html#urllib.request.urlopen", "https://requests.readthedocs.io/en/latest/user/advanced/#timeouts"]
    tags: [http, retries]
  - id: py-042
    type: single
    difficulty: 2
    prompt: Why does `pip install requests` on Ubuntu 24.04 or 26.04 fail with "externally-managed-environment"?
    choices:
      - {id: a, text: "requests is not available for Python 3.11 and later"}
      - {id: b, text: "The system Python is marked as managed by apt (PEP 668), so pip refuses to change it; use a venv or pipx"}
      - {id: c, text: "PyPI blocks Ubuntu's user agent"}
      - {id: d, text: "pip needs to be run with sudo"}
    answer: [b]
    explanation: >-
      The distribution ships an EXTERNALLY-MANAGED marker next to its Python, and pip honours it
      so that it cannot overwrite packages apt installed. Install into a virtual environment
      (python3 -m venv), use apt's python3-requests, or use pipx for applications. sudo makes it
      worse, not better.
    references: ["https://peps.python.org/pep-0668/"]
    tags: [packaging]
