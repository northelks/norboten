[project]
name = "norboten-runner"
version = "0.2.0"
description = "Norboten guest runner — injected into lab VMs. Standard library only."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []  # MUST stay empty: nothing is installed inside a lab VM

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["norboten_runner"]
