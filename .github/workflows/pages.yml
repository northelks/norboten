name: pages

# Push to main: the site built with no server behind it (NORBOTEN_SITE_STATIC=1) and pushed to the
# gh-pages branch, which GitHub Pages serves at norboten.org. The branch holds the built site and
# nothing else; its history is one commit per build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true  # only the newest build is worth publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: uv sync --all-packages --frozen
      - run: uv run python seed/generate.py
      - run: uv run python site/build.py
        env:
          NORBOTEN_SITE_STATIC: "1"
          NORBOTEN_SITE_URL: https://${{ vars.NORBOTEN_DOMAIN || 'norboten.org' }}
          NORBOTEN_SITE_GA_ID: ${{ vars.NORBOTEN_SITE_GA_ID }}
      - run: touch site/dist/.nojekyll  # serve the files as they are, no Jekyll pass
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site/dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "site: ${{ github.sha }}"
