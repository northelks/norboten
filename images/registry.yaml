# Base image registry — normative, see docs/lab-spec.md section 3.
#
# upstream: the distro's cloud image. Read only by the golden image builder (images/build.py).
#           URLs and digests are pinned; bump them deliberately, then rebuild and re-run the
#           solvability gate for every lab on that image.
# golden:   what the CLI downloads. tag/arch are written by the publish workflow — never by hand.
#
# min_memory is a VM's memory unless a lab asks for more. Measured with images/memory.py (every lab
# through the gate, the guest sampled each second; peak = MemTotal - MemAvailable) — the Ubuntu
# images on 2026-09-16, the others on 2026-09-14:
#   alpine                 256 MiB  peak   52 MiB; passes at 224; does not boot at 192 or 128
#   ubuntu-26.04           512 MiB  peak  154 MiB (linux-02), 5 labs
#   ubuntu-26.04-devops   1024 MiB  peak  490 MiB (docker-01), 10 labs
#   ubuntu-26.04-automation 3072 MiB peak 1086 MiB (ollama-02), 7 labs; ollama-03's 3 OOM kills
#                                     are its own MemoryMax=400M fault, inside the service's cgroup
#   rocky-10              1536 MiB  peak  425 MiB (rhcsa-04)
# The values keep at least twice the reference solution's peak, because a learner does more than
# the solution does (docs/open-questions.md Q12).
# Ubuntu holds 512 MiB only because the baseline builds the initramfs with MODULES=dep: with the
# stock 91 MiB initramfs a 512 MiB VM panics on "System is deadlocked on memory" about one boot
# in three (2026-09-16).
#
# ubuntu-26.04*: the plain amd64 cloud image, not amd64v3, so any x86-64 host can run it. The
# baseline purges what the cloud image carries for building rather than running — kernel headers,
# the perf and BPF tools with their LLVM and clang libraries, botocore, fwupd — which is 616 MiB of
# root filesystem and about 200 MiB of each golden image: 663 / 932 / 1141 MiB, aarch64, 2026-09-16.
#
# kind: container images have no upstream or golden artifact: the CLI builds them with Docker or
#       Podman from the Dockerfile named under `container`, on first use.

